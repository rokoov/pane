name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  package:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Build the zip and the disk image
        run: ./build.sh zip dmg
        env:
          VERSION: ${{ github.event.release.tag_name }}
      - name: Attach to the release
        if: github.event_name == 'release'
        run: |
          files=("build/Pane-${TAG#v}.dmg" "build/Pane-${TAG#v}.zip")
          gh release upload "$TAG" "${files[@]}" --clobber
          # The checksum lines in the notes are replaced, not repeated, if the release is published again
          gh release view "$TAG" --json body --jq .body | sed '/^SHA-256 of /d' > notes.md
          echo >> notes.md
          for file in "${files[@]}"; do
            printf 'SHA-256 of %s: `%s`\n' "$(basename "$file")" "$(shasum -a 256 "$file" | cut -d ' ' -f 1)" >> notes.md
          done
          gh release edit "$TAG" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
      - name: Keep the build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: Pane
          path: |
            build/Pane-*.dmg
            build/Pane-*.zip
