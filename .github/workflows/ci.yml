name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "site/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "site/**"]

env:
  # The Swift used locally, so the formatter agrees with itself
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  check:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Lint
        run: swift format lint --strict --recursive Sources Tests Package.swift
      - name: Test
        run: swift test
      - name: Build
        run: ./build.sh
